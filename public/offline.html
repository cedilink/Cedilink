<!doctype html>
<!-- Shown by the service worker (public/sw.js) when a page cannot be loaded. Self-contained on purpose: nothing here may need the network. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Cedilink Smartpay</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #f7f7f7;
        color: #242424;
        font-family:
          Manrope,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 400px;
        padding: 32px;
        border-radius: 24px;
        background: #fff;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 9999px;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      p {
        margin: 6px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: #6b7280;
      }
      button {
        margin-top: 24px;
        height: 48px;
        width: 100%;
        border: 0;
        border-radius: 9999px;
        cursor: pointer;
        background: #2330be;
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
      }
      button:hover {
        background: #1c279c;
      }
      button:focus-visible {
        outline: 2px solid #2330be;
        outline-offset: 2px;
      }
      #status {
        margin-top: 14px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>You're offline</h1>
      <p>
        Cedilink Smartpay needs a connection to load this page. Nothing has been
        lost: payments are tracked on our servers and on Stellar.
      </p>
      <button type="button" id="retry">Try again</button>
      <p id="status" role="status">
        This page reloads by itself when you're back online.
      </p>
    </main>
    <script>
      // The address bar still holds the page that was asked for, so a reload retries it.
      var reload = function () {
        location.reload();
      };
      document.getElementById("retry").addEventListener("click", reload);
      addEventListener("online", reload);
    </script>
  </body>
</html>
