<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Payment link cancelled · SmartPay</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="co">
      <header class="co-top">
        <a class="ibtn" href="#" aria-label="Back"
          ><svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="M19 12H5M11 6l-6 6 6 6" /></svg
        ></a>
        <span>SmartPay</span>
      </header>
      <main class="co-body">
        <div class="co-card">
          <span
            class="co-icon"
            style="background: var(--line); color: var(--heading)"
            aria-hidden="true"
            ><svg
              width="26"
              height="26"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M6 6l12 12" /></svg
          ></span>
          <h1>Payment link cancelled</h1>
          <p class="lead">
            Ghana Web3 Conference cancelled this payment request. You haven't
            been charged.
          </p>
          <div class="co-box">
            <dl>
              <dt>Product</dt>
              <dd>Ghana Web3 Conference Ticket</dd>
              <dt>Order ID</dt>
              <dd>CD-2026-00124</dd>
              <dt>Payment ID</dt>
              <dd>SP-00124</dd>
            </dl>
          </div>
          <p class="co-note">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
              style="flex: none; margin-top: 1px"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" /></svg
            ><span
              >Don't send USDC to this request. Ask the merchant for a new
              payment link.</span
            >
          </p>
          <a class="btn dark block" href="#">Return to Merchant</a>
        </div>
      </main>
      <div class="hands" aria-hidden="true">
        <img
          src="../../../src/assets/illustrations/new-illustration.svg"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
